<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum v5</title><style>
:root{--p:#5b4bdb;--bg:#f7f7fb;--ink:#172033;--muted:#667085;--line:#e3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}.app{max-width:1000px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p,.muted{margin:3px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 8px 24px #1720330b}.full{grid-column:1/-1}.head,.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head{align-items:center;margin-bottom:10px}.head h2{font-size:17px;margin:0}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--p);font-weight:800;margin:0 0 7px}.title{font-size:23px;line-height:1.25;margin:0 0 5px}.task{background:#f1efff;border:1px solid #ded9ff;border-radius:13px;margin:16px 0;padding:15px}.task b{display:block;font-size:17px;margin:4px 0}.task small,.row p{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;background:#edf0f5;color:var(--ink);padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--p);color:#fff}.good{background:#e5f6ec;color:#067647}.warn{background:#fff3e4;color:#a35408}.bad{background:#fcecec;color:#b42318}.small{font-size:13px;padding:7px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:11px;padding:11px}.row b{display:block}.row p{margin:3px 0}.badge{display:inline-block;border-radius:99px;background:#efedff;color:#473aaf;font-weight:800;font-size:11px;padding:2px 7px}.badge.maintain{background:#fff3e2;color:#9a5308}.badge.parked{background:#edf0f4;color:#475467}.progress{height:9px;background:#edf0f4;border-radius:10px;overflow:hidden}.progress i{display:block;background:var(--p);height:100%;width:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.notice{background:#f1efff;color:#44398a;padding:12px;border-radius:11px;margin-top:13px}.timer{font-size:36px;font-weight:850;font-variant-numeric:tabular-nums;margin:12px 0}input,textarea,select{width:100%;border:1px solid #d7dbe5;border-radius:10px;padding:10px;font:inherit}textarea{min-height:76px;resize:vertical}.inline{display:grid;grid-template-columns:1fr auto;gap:8px}.empty{color:var(--muted)}.backdrop{position:fixed;inset:0;z-index:20;background:#10182866;display:flex;align-items:center;justify-content:center;padding:16px}.backdrop[hidden]{display:none!important}.modal{position:relative;width:min(540px,100%);background:white;border-radius:18px;padding:21px;box-shadow:0 22px 60px #0004}.modal h2{margin:0 0 4px}.modal label{display:block;font-size:13px;font-weight:800;margin:13px 0 5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.close{position:absolute;right:13px;top:12px;width:34px;height:34px;border:0;border-radius:9px;background:#f0f2f6;font-size:23px;cursor:pointer}.help{display:inline-grid;place-items:center;width:20px;height:20px;vertical-align:middle;border:1px solid #9f96e7;border-radius:50%;background:#f0efff;color:#4c3fbe;font-size:12px;font-weight:850;cursor:pointer}.help:hover,.help:focus{background:var(--p);color:white}.help-pop{position:fixed;z-index:100;display:none;width:min(320px,calc(100vw - 28px));background:#25205a;color:white;border-radius:12px;padding:13px 36px 13px 14px;box-shadow:0 13px 32px #0004;font-size:14px}.help-pop.show{display:block}.help-pop button{position:absolute;right:8px;top:7px;border:0;background:transparent;color:white;font-size:21px;cursor:pointer}.toast{display:none;position:fixed;z-index:101;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 14px;border-radius:10px}.toast.show{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column;align-items:flex-start}.row{flex-direction:column}.inline{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div><h1>Momentum <button class="help" data-help="這個工具不是一般待辦清單。它只幫你在熱情下降時，仍然推進一個很小的下一步。">i</button></h1><p>冷卻時，仍然推進一小步。</p></div><span class="muted" id="date"></span></header><div class="grid"><section class="card" id="focus"></section><aside class="card"><div class="head"><h2>本週動能 <button class="help" data-help="這裡統計你本週的最小步紀錄。目標不是連續打卡，而是在停下後能重新回來。">i</button></h2><button class="btn small" id="review">每週回顧</button></div><div class="progress"><i id="bar"></i></div><p class="muted" id="progressText"></p><div class="stats"><div class="stat"><b id="doneN">0</b><span>完成最小步</span></div><div class="stat"><b id="returnN">0</b><span>冷卻後回歸</span></div></div><div class="notice" id="notice"></div></aside><section class="card full"><div class="head"><h2>專案 <button class="help" data-help="主線：本週唯一每天推進的項目。維護：只做必要工作。孵化：只做小型驗證。停車場：只記錄、不立即開始。">i</button></h2><button class="btn primary small" id="newProject">＋ 新專案</button></div><div class="list" id="projects"></div></section><section class="card"><div class="head"><h2>靈感停車場 <button class="help" data-help="新點子先放這裡，不要立即開始。每週回顧時才挑一個變成專案。">i</button></h2><span class="muted">先記下，不開工</span></div><form class="inline" id="ideaForm"><input id="ideaText" required maxlength="120" placeholder="例如：做一個 WhatsApp HR bot"><button class="btn primary">停好</button></form><div class="list" id="ideas" style="margin-top:12px"></div></section><section class="card"><div class="head"><h2>資料 <button class="help" data-help="資料只在這部裝置的瀏覽器。請定期匯出備份；換電腦時可再匯入。">i</button></h2></div><p class="muted">資料只存在這部裝置的瀏覽器。</p><div class="actions"><button class="btn small" id="export">匯出備份</button><label class="btn small">匯入備份<input id="import" type="file" accept="application/json" hidden></label><button class="btn small bad" id="wipe">清除全部</button></div></section></div></main><div class="backdrop" id="projectModal" hidden><form class="modal" id="projectForm"><button type="button" class="close" data-close>×</button><h2 id="modalTitle">建立專案</h2><p class="muted">主線是本週唯一要每天推進的專案。</p><label>專案名稱 <button type="button" class="help" data-help="用可辨認的成果名稱，例如「完成 SEO/GEO Audit MVP」，避免只寫「做 App」。">i</button></label><input id="pName" required maxlength="80"><label>今天的最小一步 <button type="button" class="help" data-help="只寫一個可在 5–30 分鐘完成的動作，例如「列出首頁 5 個欄位」。不要寫「完成網站」。">i</button></label><textarea id="pTask" required maxlength="200"></textarea><label>預估時間 <button type="button" class="help" data-help="選你今天真的願意開始的時間。低動力時請選 5 或 15 分鐘。">i</button></label><select id="pMins"><option value="5">5 分鐘</option><option value="15" selected>15 分鐘</option><option value="25">25 分鐘</option><option value="30">30 分鐘</option></select><label>狀態 <button type="button" class="help" data-help="主線：本週要推進。維護：只處理必要事項。孵化：只做一次小驗證。停車場：暫時不行動。">i</button></label><select id="pStatus"><option value="focus">設為本週主線</option><option value="maintain">維護</option><option value="parked">孵化／停車場</option></select><div class="modal-actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary">儲存</button></div></form></div><div class="backdrop" id="logModal" hidden><div class="modal"><button type="button" class="close" data-close>×</button><h2>完成後，留一個記錄 <button class="help" data-help="完成：做完最小步。部分完成：有做但未完成。跳過：今天沒做；不會懲罰你，明天回來即可。">i</button></h2><p class="muted">不是打分，而是找出甚麼狀態最容易推進。</p><div class="actions"><button class="btn good" data-log="done">完成</button><button class="btn warn" data-log="partial">部分完成</button><button class="btn" data-log="skip">今天跳過</button></div><label>現在的成就感（0–5）</label><select id="mood"><option value="0">0 — 沒感覺</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5 — 很有成就感</option></select></div></div><div id="helpPop" class="help-pop" role="dialog"><button id="helpClose">×</button><span id="helpText"></span></div><div id="toast" class="toast"></div>
<script>
const K='momentum-v5',base={projects:[],ideas:[],logs:[],timer:null};let data=load(),tickId;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],id=()=>crypto.randomUUID?.()||Date.now()+Math.random();function load(){try{return {...base,...JSON.parse(localStorage.getItem(K))}}catch{return {...base}}}function save(){localStorage.setItem(K,JSON.stringify(data));render()}function esc(s){let x=document.createElement('span');x.textContent=s||'';return x.innerHTML}function focus(){return data.projects.find(p=>p.status==='focus')}function closeAll(){$$('.backdrop').forEach(x=>x.hidden=true)}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2500)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function week(){let x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return data.logs.filter(l=>l.at>=+x)}
function render(){ $('#date').textContent=new Intl.DateTimeFormat('zh-Hant-HK',{dateStyle:'full'}).format(new Date());renderFocus();renderProjects();renderIdeas();renderStats();if(data.timer?.run)startTick() }function renderFocus(){let p=focus(),x=$('#focus');if(!p){x.innerHTML='<p class="eyebrow">今天的主線</p><h2 class="title">先選一個值得推進的項目</h2><p class="muted">本週只保留一個主線；其他新想法先放停車場。</p><button class="btn primary" id="makeFocus">建立本週主線</button>';$('#makeFocus').onclick=()=>openProject();return}let t=data.timer?.projectId===p.id?data.timer:null;x.innerHTML=`<p class="eyebrow">本週主線 <button class="help" data-help="這是你本週唯一的每日推進項目。今天只需完成一小步，不必完成整個專案。">i</button></p><h2 class="title">${esc(p.name)}</h2><div class="task"><span class="badge">今天只做這一步</span><b>${esc(p.task)}</b><small>預估 ${p.mins} 分鐘 · 做完此動作即可</small></div>${t?`<div class="timer" id="clock">${fmt(t.left)}</div><div class="actions"><button class="btn primary" id="pause">${t.run?'暫停':'繼續'}</button><button class="btn" id="end">結束並記錄</button></div>`:`<div class="actions"><button class="btn primary" id="start">開始 ${p.mins} 分鐘</button><button class="btn" id="small">改成 5 分鐘版本</button><button class="btn good" id="log">我已經做了</button></div>`}`;if(t){$('#pause').onclick=()=>{data.timer.run=!data.timer.run;data.timer.last=Date.now();save()};$('#end').onclick=()=>{data.timer=null;clearInterval(tickId);save();$('#logModal').hidden=false}}else{$('#start').onclick=()=>{data.timer={projectId:p.id,left:p.mins*60,run:true,last:Date.now()};save()};$('#small').onclick=()=>{p.task='只打開相關檔案，寫下一句「下一個可交付成果是＿＿＿」。';p.mins=5;save();toast('已改成 5 分鐘版本')};$('#log').onclick=()=>$('#logModal').hidden=false}}
function renderProjects(){let x=$('#projects');x.innerHTML=data.projects.length?data.projects.map(p=>`<div class="item"><div class="row"><div><span class="badge ${p.status}">${p.status==='focus'?'主線':p.status==='maintain'?'維護':'孵化'}</span><b>${esc(p.name)}</b><p>下一步：${esc(p.task)} · ${p.mins} 分鐘</p></div><div class="actions"><button class="btn small" data-focus="${p.id}">設為主線</button><button class="btn small" data-edit="${p.id}">編輯</button><button class="btn small bad" data-del="${p.id}">刪除</button></div></div></div>`).join(''):'<p class="empty">還沒有專案。</p>';$$('[data-focus]').forEach(b=>b.onclick=()=>{data.projects.forEach(p=>p.status=p.id===b.dataset.focus?'focus':p.status==='focus'?'parked':p.status);save()});$$('[data-edit]').forEach(b=>b.onclick=()=>openProject(data.projects.find(p=>p.id===b.dataset.edit)));$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除？')){data.projects=data.projects.filter(p=>p.id!==b.dataset.del);save()}})}function renderIdeas(){let x=$('#ideas');x.innerHTML=data.ideas.length?data.ideas.map(i=>`<div class="item"><div class="row"><b>${esc(i.text)}</b><div class="actions"><button class="btn small" data-use="${i.id}">變成專案</button><button class="btn small bad" data-rm="${i.id}">×</button></div></div></div>`).join(''):'<p class="empty">新點子放這裡，今天不用處理。</p>';$$('[data-rm]').forEach(b=>b.onclick=()=>{data.ideas=data.ideas.filter(i=>i.id!==b.dataset.rm);save()});$$('[data-use]').forEach(b=>b.onclick=()=>openProject(null,data.ideas.find(i=>i.id===b.dataset.use).text))}function renderStats(){let w=week(),n=w.filter(l=>l.status==='done').length;$('#doneN').textContent=n;$('#returnN').textContent=data.logs.filter((l,i,a)=>i&&l.status!=='skip'&&a[i-1].status==='skip').length;$('#bar').style.width=Math.min(100,n*20)+'%';$('#progressText').textContent=n?`本週完成 ${n} 個最小步。`:'本週從一個最小步開始。';$('#notice').textContent=focus()?'低動力時，將任務縮到 5 分鐘即可。':'先選一個主線，讓今天有清楚的下一步。'}function openProject(p=null,idea=''){let f=$('#projectForm');f.reset();f.dataset.id=p?.id||'';$('#modalTitle').textContent=p?'編輯專案':'建立專案';$('#pName').value=p?.name||idea;$('#pTask').value=p?.task||'定義這個想法的第一個 15 分鐘驗證步驟';$('#pMins').value=p?.mins||15;$('#pStatus').value=p?.status||'focus';$('#projectModal').hidden=false}
$('#projectForm').onsubmit=e=>{e.preventDefault();let oid=e.currentTarget.dataset.id,status=$('#pStatus').value,o={id:oid||id(),name:$('#pName').value.trim(),task:$('#pTask').value.trim(),mins:+$('#pMins').value,status};if(status==='focus')data.projects.forEach(p=>{if(p.id!==oid&&p.status==='focus')p.status='parked'});data.projects=oid?data.projects.map(p=>p.id===oid?o:p):[...data.projects,o];data.ideas=data.ideas.filter(i=>i.text!==o.name);$('#projectModal').hidden=true;save();toast('已儲存並關閉視窗')};function startTick(){clearInterval(tickId);tickId=setInterval(()=>{let t=data.timer;if(!t||!t.run)return clearInterval(tickId);let g=Math.floor((Date.now()-t.last)/1000);if(g){t.left=Math.max(0,t.left-g);t.last=Date.now();if($('#clock'))$('#clock').textContent=fmt(t.left);if(!t.left){t.run=false;clearInterval(tickId);save();$('#logModal').hidden=false}}},500)}
/* 全域 capture 事件：所有現有及之後生成的 i 都一定可用 */document.addEventListener('click',e=>{let b=e.target.closest('[data-help]');if(!b)return;e.preventDefault();e.stopPropagation();let r=b.getBoundingClientRect(),p=$('#helpPop');$('#helpText').textContent=b.dataset.help;p.classList.add('show');let left=Math.min(Math.max(14,r.left),window.innerWidth-p.offsetWidth-14),top=r.bottom+10;if(top+p.offsetHeight>window.innerHeight-12)top=Math.max(12,r.top-p.offsetHeight-10);p.style.left=left+'px';p.style.top=top+'px'},true);$('#helpClose').onclick=()=>$('#helpPop').classList.remove('show');document.addEventListener('click',e=>{if(!e.target.closest('[data-help]')&&!e.target.closest('#helpPop'))$('#helpPop').classList.remove('show')});
$$('[data-close]').forEach(b=>b.onclick=closeAll);$$('.backdrop').forEach(m=>m.onclick=e=>{if(e.target===m)m.hidden=true});$('#newProject').onclick=()=>openProject();$('#ideaForm').onsubmit=e=>{e.preventDefault();data.ideas.unshift({id:id(),text:$('#ideaText').value.trim(),at:Date.now()});$('#ideaText').value='';save()};$$('[data-log]').forEach(b=>b.onclick=()=>{let p=focus();if(!p)return;data.logs.push({id:id(),projectId:p.id,status:b.dataset.log,mood:+$('#mood').value,at:Date.now()});data.timer=null;clearInterval(tickId);closeAll();save();toast('已記錄')});$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='momentum-backup.json';a.click()};$('#import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{data={...base,...JSON.parse(r.result)};save()}catch{alert('備份檔無效')}};if(e.target.files[0])r.readAsText(e.target.files[0])};$('#wipe').onclick=()=>{if(confirm('確定清除所有資料？')){data={...base};save()}};$('#review').onclick=()=>{let w=week();toast(`本週：完成 ${w.filter(x=>x.status==='done').length} 次、部分完成 ${w.filter(x=>x.status==='partial').length} 次、跳過 ${w.filter(x=>x.status==='skip').length} 次。`)};render();
</script></body></html>
