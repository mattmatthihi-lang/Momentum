
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum v6｜冷卻救援器</title>
<style>
:root{--p:#6a5af9;--p2:#9b8cff;--pink:#ff7eb6;--mint:#2fd4a7;--amber:#ffb454;--bg:#f5f4fc;--ink:#18203a;--muted:#6b7390;--line:#e6e8f2;--glass:rgba(255,255,255,.78)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 18s ease-in-out infinite}
.b1{width:380px;height:380px;background:#b9b0ff;top:-90px;left:-70px}
.b2{width:340px;height:340px;background:#ffc6e0;top:30%;right:-90px;animation-delay:-6s}
.b3{width:320px;height:320px;background:#b8f0e0;bottom:-100px;left:25%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
.app{max-width:1120px;margin:auto;padding:26px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;animation:rise .6s both}
.top h1{margin:0;font-size:28px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--p),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p,.muted{margin:2px 0;color:var(--muted)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.full{grid-column:1/-1}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(60,50,140,.09);animation:rise .6s both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 46px rgba(60,50,140,.13)}
.grid>.card:nth-child(2){animation-delay:.08s}.grid>.card:nth-child(3){animation-delay:.16s}.grid>.card:nth-child(4){animation-delay:.24s}.grid>.card:nth-child(5){animation-delay:.32s}.grid>.card:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.head,.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head{align-items:center;margin-bottom:12px}.head h2{font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--p);font-weight:800;margin:0 0 6px}
.title{font-size:25px;line-height:1.25;margin:0 0 4px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:#ece9ff}.ring .fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.9,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-size:30px;line-height:1}.ring .num span{font-size:11px;color:var(--muted)}
.task{background:linear-gradient(135deg,#f1eeff,#fff4fa);border:1px solid #e1dcff;border-radius:16px;margin:14px 0;padding:14px 16px;position:relative;overflow:hidden}
.task::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 4.5s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.task b{display:block;font-size:17px;margin:3px 0}.task small{color:var(--muted)}
.btn{border:0;border-radius:12px;background:#edeff7;color:var(--ink);padding:10px 14px;font-weight:750;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(60,50,140,.15)}.btn:active{transform:scale(.96)}
.primary{background:linear-gradient(135deg,var(--p),#8a6bff);color:#fff}.good{background:#dff7ee;color:#067647}.warn{background:#fff1dc;color:#a35408}.bad{background:#fdeaea;color:#b42318}.small{font-size:13px;padding:7px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.timer{font-size:40px;font-weight:850;font-variant-numeric:tabular-nums;margin:10px 0;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.78}}
.ms{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.ms h3{font-size:14px;margin:0 0 8px}
.m-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer;transition:background .2s}.m-item:hover{background:#f3f1ff}
.m-box{width:20px;height:20px;border-radius:7px;border:2px solid #c9c3f5;display:grid;place-items:center;flex:none;font-size:13px;color:#fff;transition:.25s}
.m-item.done .m-box{background:linear-gradient(135deg,var(--mint),#18b88f);border-color:transparent;transform:scale(1.08)}
.m-item.done span{text-decoration:line-through;color:var(--muted)}
.m-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center;transition:transform .2s}.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:24px;line-height:1.1}.stat span{font-size:11px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;padding:6px 2px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bar{width:100%;max-width:22px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--p2),var(--p));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.2,1) both}
.bar.part{background:linear-gradient(180deg,#ffd9a6,var(--amber))}.bar.zero{background:#e8e9f2;height:4px!important}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.labels{display:flex;gap:5px;margin-top:4px}.labels span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.pbars{margin-top:16px;display:grid;gap:10px}
.pb-row .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.pb{height:9px;border-radius:99px;background:#ecebf6;overflow:hidden}.pb i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.pb.main{height:13px}.pb.main i{background:linear-gradient(90deg,var(--p),var(--pink))}.pb.side i{background:linear-gradient(90deg,#8ec5ff,#6fe0d0)}
.list{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;transition:transform .2s,box-shadow .2s;animation:rise .4s both}.item:hover{transform:translateX(3px);box-shadow:0 6px 16px rgba(60,50,140,.08)}
.item.side{border-left:4px solid #77c9f0}
.row b{display:block}.row p{margin:3px 0;font-size:13px;color:var(--muted)}
.badge{display:inline-block;border-radius:99px;background:#efedff;color:#473aaf;font-weight:800;font-size:11px;padding:2px 8px;margin-bottom:3px}
.badge.side{background:#e0f3ff;color:#176a9b}.badge.maintain{background:#fff1dc;color:#9a5308}.badge.parked{background:#edf0f4;color:#475467}
details{margin-top:6px}summary{cursor:pointer;font-size:13px;color:var(--p);font-weight:700}
.mini{height:6px;border-radius:9px;background:#ecebf6;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:linear-gradient(90deg,#8ec5ff,#6fe0d0);transition:width 1s}
input,textarea,select{width:100%;border:1px solid #d9dcec;border-radius:12px;padding:10px;font:inherit;background:#fff;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(106,90,249,.14)}
textarea{min-height:76px;resize:vertical}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px}
.empty{color:var(--muted);padding:6px 0}
.notice{background:linear-gradient(135deg,#f1eeff,#fff4fa);color:#43388a;padding:12px 14px;border-radius:13px;margin-top:14px}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(20,24,50,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}
.backdrop[hidden]{display:none!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 4px}.modal label{display:block;font-size:13px;font-weight:800;margin:13px 0 5px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:0;border-radius:10px;background:#f0f1f7;font-size:22px;cursor:pointer;transition:.2s}.close:hover{background:#e3e5ef;transform:rotate(90deg)}
.help{display:inline-grid;place-items:center;width:20px;height:20px;vertical-align:middle;border:1px solid #a89fee;border-radius:50%;background:#f0eeff;color:#4c3fbe;font-size:12px;font-weight:850;cursor:pointer;transition:.2s}.help:hover{background:var(--p);color:#fff;transform:scale(1.15)}
.help-pop{position:fixed;z-index:200;display:none;width:min(330px,calc(100vw - 28px));background:#262058;color:#fff;border-radius:14px;padding:14px 36px 14px 15px;box-shadow:0 16px 36px rgba(0,0,0,.35);font-size:14px}
.help-pop.show{display:block;animation:pop .25s both}.help-pop button{position:absolute;right:8px;top:6px;border:0;background:transparent;color:#fff;font-size:21px;cursor:pointer}
.toast{display:none;position:fixed;z-index:210;bottom:20px;left:50%;transform:translateX(-50%);background:#18203a;color:#fff;padding:11px 16px;border-radius:12px;max-width:92%}
.toast.show{display:block;animation:rise .3s both}
